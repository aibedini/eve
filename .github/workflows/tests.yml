name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASK_ENV: development
  DISABLE_BACKGROUND_THREADS: "1"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pytest>=8,<10"
      - name: Run focused unit tests
        run: |
          set +e
          pytest -q --tb=short \
            tests/test_security_hardening.py \
            tests/test_wallet_ledger.py \
            tests/test_backup_policy.py \
            tests/test_ci_guards.py \
            tests/test_package_visibility.py \
            tests/test_finance_filters.py \
            tests/test_regression_matrix.py > pytest-unit.log 2>&1
          status=$?
          tail -n 40 pytest-unit.log
          if [ "$status" -ne 0 ]; then
            # Surface the failing test ids as a check-run annotation so a
            # collection error is diagnosable from the API without log access.
            failures=$(grep -E '^(FAILED|ERROR) ' pytest-unit.log | head -n 15 | tr '\n' '|' | cut -c1-900)
            echo "::error title=pytest failed ($status)::$failures"
          fi
          exit $status

  latency-slo:
    name: Latency SLOs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: Measure the mutation -> cache -> UI latency SLOs
        # Non-zero exit on any p95 over budget: this step is the gate, so it must
        # never be allowed to fail silently. Budgets: docs/performance/LATENCY_SLO.md.
        run: python scripts/benchmark_latency_slo.py --quick --json latency-slo.json
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-slo
          path: latency-slo.json
          if-no-files-found: warn

  mutation-scale:
    name: Mutation scale (O(1))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
      - name: Prove one mutation does not scale with the panel count
        # Non-zero exit when the mutation cost, the delta size, the Redis op count,
        # the zero-panel-call guarantee or the poll bound regresses.
        # Relations and measured values: docs/performance/MUTATION_SCALE.md.
        run: python scripts/benchmark_mutation_scale.py --quick --json mutation-scale.json
      - name: Upload the measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-scale
          path: mutation-scale.json
          if-no-files-found: warn

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pytest>=8,<10"
      - name: Run full test suite
        run: |
          set +e
          pytest -q --tb=short > pytest-all.log 2>&1
          status=$?
          tail -n 40 pytest-all.log
          if [ "$status" -ne 0 ]; then
            failures=$(grep -E '^(FAILED|ERROR) ' pytest-all.log | head -n 15 | tr '\n' '|' | cut -c1-900)
            echo "::error title=pytest failed ($status)::$failures"
          fi
          exit $status
