name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  FLASK_ENV: development
  DISABLE_BACKGROUND_THREADS: "1"

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pytest>=8,<10"
      - name: Run focused unit tests
        run: |
          pytest -q \
            tests/test_security_hardening.py \
            tests/test_wallet_ledger.py \
            tests/test_backup_policy.py \
            tests/test_ci_guards.py \
            tests/test_package_visibility.py \
            tests/test_finance_filters.py

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install "pytest>=8,<10"
      - name: Run full test suite
        run: pytest -q
