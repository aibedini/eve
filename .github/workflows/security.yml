name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3

  secrets-and-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Full-history secret scan. .gitleaks.toml allowlists one documented
      # non-secret test fixture; any other leak fails the job.
      - name: Full git-history secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependency audit (pip-audit)
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock

      # setup-trivy is pinned to an exact Trivy version and given the job
      # token: the previous composite trivy-action passed an empty token to
      # setup-trivy, which made it fail while resolving the release (the step
      # aborted in a few seconds even on a cold cache).
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1 # v0.2.4
        with:
          version: v0.74.0
          cache: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan (blocking)
        run: |
          trivy fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --skip-dirs .git \
            --skip-dirs .venv-test \
            --skip-dirs offline \
            .

  forbidden-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Refuse tracked DB / backup / key artifacts
        run: python scripts/check_tracked_artifacts.py
      - name: Refuse artifacts added by this change
        if: github.event_name == 'pull_request'
        run: |
          python scripts/check_tracked_artifacts.py \
            --range "origin/${{ github.base_ref }}...${{ github.sha }}"
