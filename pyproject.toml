[project]
name = "repl-nix-workspace"
version = "1.9.1"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.2",
    "flask-limiter>=4.0.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "jdatetime>=5.2.0",
    "pillow>=12.0.0",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "urllib3>=2.5.0",
    "werkzeug>=3.1.4",
    "bleach>=6.0.0",
    "cryptography>=42.0.0",
    "psycopg2-binary>=2.9.10",
    "redis>=5.0.0",
]

[tool.setuptools]
py-modules = ["app", "main"]

[tool.pytest.ini_options]
# The suite imports the top-level "app" module. The pytest console script does
# not put the repository root on sys.path (only "python -m pytest" does), so
# CI failed with "ModuleNotFoundError: No module named 'app'". Make the intent
# explicit for every invocation.
pythonpath = ["."]
testpaths = ["tests"]
